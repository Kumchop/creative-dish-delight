<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Kumchop logo</title>
  <desc id="desc">Orange handwritten Kumchop wordmark with fork, chef hat and a slogan.</desc>
  <defs>
    <linearGradient id="kumchopOrange" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="50%" stop-color="#ff5c00"/>
      <stop offset="100%" stop-color="#ff8a1d"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="3" flood-color="#d45d00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <g transform="translate(60,50)">
      <path d="M39 120 C30 82, 36 58, 52 26 C60 12, 73 0, 84 7 C95 14, 85 34, 79 53 C73 72, 75 100, 90 136 L87 180 L58 180 C53 166, 45 145, 39 120 Z" fill="url(#kumchopOrange)" opacity="0.9"/>
      <g fill="none" stroke="url(#kumchopOrange)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 180 L47 180"/>
        <path d="M20 150 L40 150"/>
        <path d="M26 120 L34 120"/>
        <path d="M20 180 L20 28"/>
        <path d="M32 180 L32 62"/>
        <path d="M44 180 L44 98"/>
      </g>
    </g>

    <text x="260" y="260" font-size="220" font-family="'Segoe Print', 'Bradley Hand', 'Segoe Script', cursive" font-weight="700" fill="url(#kumchopOrange)" letter-spacing="-6">Kumchop</text>

    <g transform="translate(905,105)">
      <path d="M30 0 C58 -16, 90 0, 100 24 C112 52, 96 83, 62 96 C28 109, -3 93, -14 60 C-24 31, -14 7, 30 0 Z" fill="none" stroke="url(#kumchopOrange)" stroke-width="12"/>
      <path d="M25 22 C44 0, 60 0, 78 20" fill="none" stroke="url(#kumchopOrange)" stroke-width="10" stroke-linecap="round"/>
      <path d="M18 60 C26 48, 34 45, 43 48" fill="none" stroke="url(#kumchopOrange)" stroke-width="8" stroke-linecap="round"/>
      <path d="M0 58 C20 43, 33 42, 52 35" fill="none" stroke="url(#kumchopOrange)" stroke-width="9" stroke-linecap="round"/>
      <path d="M54 103 C50 118, 52 130, 60 145" fill="none" stroke="url(#kumchopOrange)" stroke-width="9" stroke-linecap="round"/>
      <path d="M80 105 C79 121, 89 130, 135 128" fill="none" stroke="url(#kumchopOrange)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="58" cy="47" r="84" fill="none" stroke="url(#kumchopOrange)" stroke-width="10"/>
      <path d="M58 32 L58 90" stroke="url(#kumchopOrange)" stroke-width="10" stroke-linecap="round"/>
      <path d="M25 58 L90 58" stroke="url(#kumchopOrange)" stroke-width="10" stroke-linecap="round"/>
    </g>

    <text x="280" y="390" font-size="76" font-family="'Segoe Print', 'Bradley Hand', cursive" font-style="italic" fill="url(#kumchopOrange)" letter-spacing="1">Every taste feels good...</text>
  </g>
</svg>
